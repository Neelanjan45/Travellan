{% extends "_base.html" %}

{% block content %}
    <div class="row">
        {% for site in sites %}
            <div class="col">
                <img src="{{ site.image }}" alt="{{ site.title }}">
                <h3>{{ site.title }}</h3>
                <p>{{ site.description }}</p>
                <h4>Location: <a href="#">{{ site.location.title }}</a></h4>
            </div>
        {% endfor %}
    </div>
{% endblock %}
